name: CI

# Contrôles requis par le ruleset de main (README, « Sécurité du dépôt » ;
# liste dans .github/ruleset-main.json, un context par nom de job).
# Jobs R : conteneur épinglé par empreinte, BLAS et LAPACK contrôlées par
# tests/controles/plateforme.R (ADR 0008). Job « Documentation » : paquets
# TeX de l'hôte par apt-get (ADR 0008, point 6).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Contrôles du dépôt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Réglages Claude Code valides
        run: |
          set -euo pipefail
          python3 -m json.tool .claude/settings.json > /dev/null
          echo "settings.json : JSON valide."
      - name: Fiches d'agents complètes
        run: |
          set -euo pipefail
          statut=0
          for f in .claude/agents/*.md; do
            for champ in name description tools model; do
              if ! sed -n '2,/^---$/p' "$f" | grep -q "^$champ:"; then
                echo "::error file=$f::champ '$champ' absent du frontmatter"; statut=1
              fi
            done
          done
          exit $statut
      - name: Fiches -approfondi à jour
        run: bash .claude/outils/fiches_jumelles.sh --verifier
      - name: Aucun fichier sensible versionné
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.(pem|key|p12|pfx)|id_rsa.*|id_ed25519.*|settings\.local\.json|CLAUDE\.local\.md)$'; then
            echo "::error::fichier sensible versionné (voir la liste ci-dessus)"; exit 1
          fi
          echo "Aucun fichier sensible versionné."

  # ADR 0008, points 1 à 6 ; issue #8. Aucun package du CRAN n'est installé
  # ni aucun dépôt CRAN configuré : tablexp est installé depuis l'arbre de
  # travail par chaque batterie, dans une bibliothèque temporaire.
  tests:
    name: Tests (R 4.3.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Empreinte de l'index multi-architecture de rocker/r-ver:4.3.3, relevée
      # le 16/10/2026 par `docker buildx imagetools inspect` sur l'exécuteur
      # (exécution 38903692466, ADR 0008, point 2). Même chaîne dans
      # TABLEXP_IMAGE ci-dessous (tests/controles/identite_batteries.R).
      image: rocker/r-ver:4.3.3@sha256:732d15020af326da9e919c07f70ca32bf5d3e409220af32e0a4b6d0a89437309
    env:
      TABLEXP_IMAGE: rocker/r-ver:4.3.3@sha256:732d15020af326da9e919c07f70ca32bf5d3e409220af32e0a4b6d0a89437309
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Première étape, avant tout calcul (ADR 0008, point 3). Si elle échoue,
      # l'étape « Plateforme (mode strict) », sans `if:`, est sautée ; les
      # étapes suivantes, sous `if: ${{ !cancelled() }}`, s'exécutent quand
      # même, pour que tous les écarts soient visibles (de même si l'étape de
      # plateforme échoue) ; le job reste en échec. Aucune référence n'est
      # produite par ce job.
      # L'image charge OpenBLAS 0.3.20 (relevé du 16/10/2026) : bascule vers le
      # BLAS et le LAPACK de référence (Netlib, paquets libblas3 et liblapack3
      # d'Ubuntu 22.04) par update-alternatives, comme outil_USP (décision du
      # mainteneur du 16/10/2026, M47 ; ADR 0008, point 3). Aucun calcul ici ;
      # l'étape suivante vérifie que R charge bien ces bibliothèques.
      - name: BLAS et LAPACK de référence
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "::error::architecture $(uname -m) inattendue"; exit 1; }
          lib=/usr/lib/x86_64-linux-gnu
          apt-get update -q
          apt-get install -y -q --no-install-recommends libblas3 liblapack3
          update-alternatives --set libblas.so.3-x86_64-linux-gnu "$lib/blas/libblas.so.3"
          update-alternatives --set liblapack.so.3-x86_64-linux-gnu "$lib/lapack/liblapack.so.3"
          echo "libblas.so.3   -> $(readlink -f "$lib/libblas.so.3")"
          echo "liblapack.so.3 -> $(readlink -f "$lib/liblapack.so.3")"
          dpkg-query -W -f='${Package} ${Version}\n' libblas3 liblapack3
      - name: Plateforme (mode strict)
        run: Rscript tests/controles/plateforme.R --exiger
      # Batteries de CLAUDE.md, « Commandes » : une étape « Batterie : » par
      # commande, dans le même ordre (tests/controles/identite_batteries.R).
      - name: "Batterie : tests unitaires"
        if: ${{ !cancelled() }}
        run: Rscript tests/test_unitaires.R
      - name: "Batterie : reproductibilité"
        if: ${{ !cancelled() }}
        run: Rscript tests/test_reproductibilite.R
      - name: "Batterie : concordance documentation et moteur"
        if: ${{ !cancelled() }}
        run: Rscript tests/concordance_doc_moteur.R --strict
      - name: Liste blanche de DESCRIPTION
        if: ${{ !cancelled() }}
        run: Rscript tests/controles/liste_blanche_description.R
      - name: Ordre des modules
        if: ${{ !cancelled() }}
        run: Rscript tests/controles/graphe_modules.R
      - name: Identité des batteries et de l'image
        if: ${{ !cancelled() }}
        run: Rscript tests/controles/identite_batteries.R
      # Issue #66 : les batteries installent tablexp en UTF-8 ; ce contrôle
      # l'installe et l'exécute aussi sous la locale C (R1 à R6, fiche et plan,
      # identiques octet à octet à ceux écrits en UTF-8). Hors liste des
      # batteries de CLAUDE.md : contrôle à part, comme les trois précédents.
      - name: Locale C (installation et exécution)
        if: ${{ !cancelled() }}
        run: Rscript tests/controles/locale_c.R

  # ADR 0008, point 7 ; issue #3. Métadonnées de l'instantané daté du CRAN
  # (date dans tests/controles/absence_java.R), lues sans rien installer ;
  # aucun résultat produit, hors plateforme de référence. Une panne réseau
  # fait échouer le job (code 2), une relance la lève.
  absence_java:
    name: Absence de Java
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Même chaîne que le job de tests (ADR 0008, point 1 ;
      # tests/controles/identite_batteries.R).
      image: rocker/r-ver:4.3.3@sha256:732d15020af326da9e919c07f70ca32bf5d3e409220af32e0a4b6d0a89437309
    env:
      TABLEXP_IMAGE: rocker/r-ver:4.3.3@sha256:732d15020af326da9e919c07f70ca32bf5d3e409220af32e0a4b6d0a89437309
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Packages de l'application, de la contre-vérification et du moteur
        run: Rscript tests/controles/absence_java.R
      # Cas témoin : ELT dépend de Java par xlsx ; le contrôle doit rendre le
      # code 1 (verdict) et la chaîne, pas 0 ni 2 (panne). Le shell de l'étape
      # est `bash -eo pipefail` : le code non nul est capté par `|| statut=$?`,
      # sans quoi -e arrêterait l'étape dans le cas attendu.
      - name: Cas témoin (ELT doit échouer)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          statut=0
          sortie=$(Rscript tests/controles/absence_java.R --ajouter ELT 2>&1) || statut=$?
          echo "$sortie"
          if [ "$statut" -ne 1 ] || ! grep -q "ELT dépend de Java (ELT -> xlsx" <<< "$sortie"; then
            echo "::error title=Absence de Java::cas témoin ELT non détecté (code $statut)"; exit 1
          fi
          echo "Cas témoin : ELT détecté, code 1."

  # ADR 0008, point 6 ; issue #8, point 7. Compilation du PDF de docs/latex/
  # sans action tierce : paquets TeX de l'exécuteur par apt-get, sur
  # ubuntu-24.04 (exécuteur épinglé par version ; la version des paquets suit
  # l'image de l'exécuteur et est affichée par dpkg-query). Commande et
  # critères de docs/latex/CONVENTIONS.md, section 6 : pdflatex relancé tant
  # que le journal demande une nouvelle passe, cinq passes au plus ; échec
  # sur un journal absent ou vide après une passe, sur une ligne commençant
  # par « ! » suivi d'une espace (erreur TeX ; un « ! » seul peut venir d'une
  # boîte mal remplie qui reproduit $\to$) ou sur « undefined » dans le
  # journal final, et si une nouvelle passe est encore demandée après la
  # cinquième. Le PDF versionné est retiré avant la compilation.
  # Les commandes dont l'échec est attendu sont gardées (|| statut=$?,
  # || true, if) : -e n'arrête l'étape sur aucune d'elles. Aucun résultat
  # produit ; le PDF compilé et son journal sont publiés en artefact par
  # actions/upload-artifact (action de GitHub, épinglée par SHA) ; le PDF
  # versionné reste celui que commite la session principale.
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Paquets TeX
        run: |
          set -euo pipefail
          paquets="texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-french texlive-pictures texlive-plain-generic"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $paquets
          dpkg-query -W -f='${Package} ${Version}\n' $paquets
          pdflatex --version | sed -n 1p
      - name: Compilation de docs/latex/doc_outil_tables.tex
        working-directory: docs/latex
        run: |
          set -euo pipefail
          # PDF versionné retiré : l'artefact est le PDF compilé ici.
          rm -f doc_outil_tables.pdf
          for passe in 1 2 3 4 5; do
            statut=0
            pdflatex -interaction=nonstopmode -halt-on-error doc_outil_tables.tex > /dev/null || statut=$?
            echo "Passe $passe : code $statut"
            [ -s doc_outil_tables.log ] || { echo "::error title=Documentation::journal doc_outil_tables.log absent ou vide (passe $passe)"; exit 1; }
            if [ "$statut" -ne 0 ]; then
              grep -n -A3 '^! ' doc_outil_tables.log || true
              echo "::error title=Documentation::pdflatex en échec (code $statut, passe $passe)"; exit 1
            fi
            grep -q -E 'Rerun to get|Rerun LaTeX|Label\(s\) may have changed' doc_outil_tables.log || break
            if [ "$passe" -eq 5 ]; then
              echo "::error title=Documentation::nouvelle passe encore demandée après 5 passes (renvoi qui oscille)"; exit 1
            fi
          done
          ecart=0
          if grep -n '^! ' doc_outil_tables.log; then
            echo "::error title=Documentation::ligne commençant par « ! » suivi d’une espace (erreur TeX) dans le journal"; ecart=1
          fi
          if grep -n 'undefined' doc_outil_tables.log; then
            echo "::error title=Documentation::« undefined » dans le journal"; ecart=1
          fi
          echo "Overfull : $(grep -c '^Overfull' doc_outil_tables.log || true) ; Underfull : $(grep -c '^Underfull' doc_outil_tables.log || true)"
          exit $ecart
      # Aussi après un échec de la compilation, pour publier le journal (le
      # PDF peut alors manquer) ; échec seulement si aucun des deux fichiers
      # n'existe.
      - name: PDF compilé en artefact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc_outil_tables
          path: |
            docs/latex/doc_outil_tables.pdf
            docs/latex/doc_outil_tables.log
          if-no-files-found: error
          retention-days: 30
